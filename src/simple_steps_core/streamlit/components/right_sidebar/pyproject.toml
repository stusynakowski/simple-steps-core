[project]
name = "streamlit-right-sidebar"
version = "0.1.0"
description = "A collapsible Streamlit sidebar docked to the right edge of the app, mirroring st.sidebar."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "streamlit-components contributors" }]
keywords = ["streamlit", "streamlit-component", "sidebar", "ui"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = ["streamlit>=1.30"]

[project.urls]
Homepage = "https://github.com/stuartsynakowski/streamlit-components"
Repository = "https://github.com/stuartsynakowski/streamlit-components"
Issues = "https://github.com/stuartsynakowski/streamlit-components/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["right_sidebar"]

[tool.hatch.build.targets.sdist]
include = [
    "right_sidebar/**",
    "README.md",
    "pyproject.toml",
]
exclude = [
    "right_sidebar/frontend/node_modules",
    "right_sidebar/frontend/src",
    "right_sidebar/frontend/public",
    "right_sidebar/frontend/package*.json",
    "right_sidebar/frontend/tsconfig.json",
]
