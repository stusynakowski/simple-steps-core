[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-steps-core"
version = "0.1.0"
description = "The grid model behind Simple Steps: tools, steps and workflows you can run from a Python session"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Simple Steps" }
]
keywords = ["workflow", "orchestration", "backend", "tool-calls"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries"
]
# One runtime dependency. pandas backs the grid model: its index is the stable
# row id that references, lineage and per-row staleness rely on. Notebooks are
# an extra, so importing this package pulls in nothing else.
dependencies = [
  "pandas>=2.0",
]

[project.optional-dependencies]
examples = [
  "notebook>=7.6.0",
  "ipywidgets>=8.1.0"
]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "build",
  "twine"
]
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Coverage is opt-in (`pytest --cov`) rather than in addopts, so the ordinary
# test loop stays fast. See scripts/run_checks.sh for the full gate.
[tool.coverage.run]
source = ["src/simple_steps_core"]
branch = true
[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]
