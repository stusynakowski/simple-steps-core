[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-steps-core"
version = "0.1.0"
description = "Core runtime for tool-first workflow execution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Simple Steps" }
]
keywords = ["workflow", "orchestration", "backend", "tool-calls"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries"
]
# Two core runtime dependencies, and no more. Pydantic powers model
# validation, serialization (save/load of workflows) and argument schema
# generation. pandas backs the grid model: its index is the stable cell
# address that per-cell re-drive and incremental staleness both require
# (docs/shape-algebra.md §9). Everything else — the HTTP server, notebooks,
# the agent layer — is an extra, so importing this package pulls in neither a
# web framework nor Jupyter.
dependencies = [
  "pandas>=2.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
agent = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0"
]
examples = [
  "notebook>=7.6.0",
  "ipywidgets>=8.1.0"
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27"
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "build",
  "twine"
]
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Coverage is opt-in (`pytest --cov`) rather than in addopts, so the ordinary
# test loop stays fast. See scripts/run_checks.sh for the full gate.
[tool.coverage.run]
source = ["src/simple_steps_core"]
branch = true
[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]
